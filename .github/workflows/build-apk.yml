name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PartSouq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PartSouq.apk
          gh release create "v1.${{ github.run_number }}" PartSouq.apk \
            --title "PartSouq APK v1.${{ github.run_number }}" \
            --notes "Debug APK. Download PartSouq.apk and install it."
